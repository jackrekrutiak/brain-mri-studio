<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRI Studio Viewer</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#18202b; --line:#243041; --text:#e6edf5; --muted:#8b98a9;
    --accent:#ff8a3d; --accent2:#ffb07a; --ok:#3ecf8e; --warn:#ff6b5e; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .src{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{flex:1}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;color:var(--muted);font-size:12.5px}
  .seg button.on{background:var(--accent);color:#1a0d03;font-weight:600}
  main{display:grid;grid-template-columns:1fr 320px;min-height:0}
  .stage{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .btn{all:unset;cursor:pointer;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
    font-size:12.5px;color:var(--text)}
  .btn:hover{border-color:var(--accent)} .btn.on{border-color:var(--accent);color:var(--accent2)}
  .btn.primary{background:var(--accent);color:#1a0d03;border-color:var(--accent);font-weight:600}
  .toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  input[type=range]{accent-color:var(--accent);width:110px}
  .canvaswrap{position:relative;min-height:0}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
  .hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:11.5px;pointer-events:none;
    background:rgba(11,15,20,.7);padding:4px 8px;border-radius:6px}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px}
  .finding{font-size:22px;font-weight:650;margin:0 0 2px}
  .pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(255,138,61,.14);color:var(--accent2)}
  .pill.ok{background:rgba(62,207,142,.14);color:var(--ok)}
  .bar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
  .bar .track{height:8px;background:#0e141c;border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:99px}
  .bar .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  svg.spark{width:100%;height:84px;cursor:crosshair;display:block}
  .muted{color:var(--muted)} .small{font-size:12px}
  .step h2{font-size:18px;margin:2px 0 8px}
  .step p{margin:0 0 10px;color:#cdd6e1}
  .step ul{margin:6px 0 0;padding-left:18px;color:#cdd6e1} .step li{margin:4px 0}
  .dots{display:flex;gap:6px;margin:4px 0 12px} .dots span{height:4px;flex:1;border-radius:9px;background:var(--line)}
  .dots span.on{background:var(--accent)}
  .nav{display:flex;gap:8px;justify-content:space-between}
  footer{padding:8px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
  @media (max-width: 700px){
    main{grid-template-columns:1fr;grid-template-rows:60vh auto}
    aside{border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MRI Studio</h1><span class="src" id="src"></span>
    <span class="spacer"></span>
    <div class="seg" id="modeSeg"><button data-m="clinician">Clinician</button><button data-m="patient">Patient</button></div>
  </header>
  <main>
    <section class="stage">
      <div class="toolbar">
        <div class="seg" id="viewSeg">
          <button data-v="4">3D</button><button data-v="3">3-plane</button>
          <button data-v="0">Axial</button><button data-v="1">Coronal</button><button data-v="2">Sagittal</button>
        </div>
        <button class="btn" id="hotBtn">◎ Jump to hotspot</button>
        <button class="btn" id="cutBtn">Cut away</button>
        <button class="btn on" id="heatBtn">Heatmap</button>
        <label>Opacity <input type="range" id="heatOp" min="0" max="1" step="0.05" value="0.75"></label>
        <label title="Show only the strongest part of the heatmap">Focus <input type="range" id="heatThr" min="0" max="250" step="1"></label>
      </div>
      <div class="canvaswrap">
        <canvas id="gl"></canvas>
        <div class="loading" id="loading">Loading 3D volume…</div>
        <div class="hint" id="hint">Drag to rotate · scroll to zoom · click a slice to move the crosshair</div>
      </div>
    </section>
    <aside id="panel"></aside>
  </main>
  <footer id="disc"></footer>
</div>

<script>/*__NIIVUE__*/</script>
<script>
const D = __PAYLOAD__;
const $ = s => document.querySelector(s);
const pct = v => (v*100).toFixed(0) + '%';
$('#src').textContent = D.source;
$('#disc').textContent = D.disclaimer;

function b64ToUrl(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u], {type:'application/gzip'}));
}

const nv = new niivue.Niivue({
  backColor:[0.043,0.059,0.078,1], show3Dcrosshair:true, crosshairColor:[1,0.54,0.24,1],
  isColorbar:false, dragAndDropEnabled:false, multiplanarForceRender:true,
  clipPlaneColor:[0.043,0.059,0.078,0]
});
let heatOn = true, cutOn = false, view = 4, heatOpacity = 0.75;

function setView(v){
  view = v; nv.setSliceType(v);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.v===v));
}
function setHeat(on){
  heatOn = on; nv.setOpacity(1, on ? heatOpacity : 0);
  $('#heatBtn').classList.toggle('on', on);
}
function setCut(on){
  cutOn = on;
  nv.setClipPlane(on ? [0.05, 270, 0] : [2, 0, 0]);
  $('#cutBtn').classList.toggle('on', on);
}
function jumpTo(vox){
  nv.scene.crosshairPos = nv.vox2frac(vox);
  nv.updateGLVolume(); nv.drawScene();
}
function jumpHotspot(){ jumpTo(D.hotspot); }
function spin(az, el){ nv.setRenderAzimuthElevation(az, el); }

// ---------------- Clinician panel ----------------
function clinicianPanel(){
  const bars = Object.entries(D.summary).sort((a,b)=>b[1]-a[1]).map(([n,v]) =>
    `<div class="bar"><span>${n}</span><div class="track"><div class="fill" style="width:${(v*100).toFixed(1)}%"></div></div><span class="num">${pct(v)}</span></div>`).join('');
  const Z = D.curve.length, W = 320, H = 84;
  let path = '', started = false;
  D.curve.forEach((v,z)=>{ if(v===null){started=false;return;}
    const x = (z/(Z-1))*W, y = H-4 - v*(H-10);
    path += (started?'L':'M') + x.toFixed(1)+','+y.toFixed(1)+' '; started = true; });
  const hx = (D.hotspot[2]/(Z-1))*W;
  return `
  <div class="card">
    <div class="eyebrow">Model finding</div>
    <div class="finding">${D.findingTitle}</div>
    <span class="pill ${D.normal?'ok':''}">${D.normal ? 'no tumour pattern' : 'peak abnormal-slice probability ' + pct(D.peak)}</span>
  </div>
  <div class="card">
    <div class="eyebrow">Scan-level probabilities</div>
    ${bars}
    <div class="muted small" style="margin-top:6px">Mean over the 5 most suspicious slices.</div>
  </div>
  <div class="card">
    <div class="eyebrow">Abnormality by slice (inferior → superior)</div>
    <svg class="spark" id="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="0" x2="${W}" y1="${H-4-0.5*(H-10)}" y2="${H-4-0.5*(H-10)}" stroke="#243041" stroke-dasharray="3 3"/>
      <line x1="${hx}" x2="${hx}" y1="0" y2="${H}" stroke="#ff8a3d" stroke-width="1" opacity=".6"/>
      <path d="${path}" fill="none" stroke="#ffb07a" stroke-width="1.6"/>
    </svg>
    <div class="muted small">Click the chart to jump to that slice. Dashed line = 50%.</div>
  </div>
  <div class="card small">
    <div class="eyebrow">Heatmap</div>
    Grad-CAM for class <b>${D.target}</b>, weighted by each slice's probability. Hotspot voxel
    <span class="muted">[${D.hotspot.join(', ')}]</span> of volume ${D.shape.join('×')}.
  </div>`;
}
function wireSpark(){
  const s = $('#spark'); if(!s) return;
  s.addEventListener('click', e=>{
    const r = s.getBoundingClientRect(), z = Math.round((e.clientX-r.left)/r.width*(D.curve.length-1));
    setView(3); jumpTo([D.hotspot[0], D.hotspot[1], Math.max(0,Math.min(D.curve.length-1,z))]);
  });
}

// ---------------- Patient walkthrough ----------------
const steps = [
  { t:'This is your brain scan',
    p:'An MRI takes hundreds of thin pictures of your head. Stacked together, they make this 3D model. Drag it to turn it around.',
    go(){ setView(4); setCut(false); setHeat(false); spin(110, 15); } },
  { t: D.normal ? 'What the computer checked' : 'The highlighted area',
    p: D.normal
      ? 'The computer looked through every slice for patterns of three common tumour types. It did not find them.'
      : 'We cut the model open so you can see inside. The warm colours show the area that most influenced the computer’s result.',
    go(){ setView(4); setHeat(!D.normal); setCut(true); spin(90, 10); jumpHotspot(); } },
  { t:'A closer look',
    p:'These are three flat views through the same spot: from above, from the front and from the side. The orange crosshair marks the point of interest.',
    go(){ setCut(false); setHeat(!D.normal); setView(3); jumpHotspot(); } },
  { t:'What this type of finding is: ' + D.info.title,
    p: D.info.plain,
    go(){ setView(4); setHeat(!D.normal); setCut(!D.normal); spin(200, 20); } },
  { t:'What usually happens next',
    p: D.info.next,
    extra: '<div class="eyebrow" style="margin-top:6px">Questions you may want to ask</div><ul>' +
           D.questions.map(q=>`<li>${q}</li>`).join('') + '</ul>',
    go(){ setView(4); setCut(false); setHeat(!D.normal); spin(110,15); } },
];
let si = 0;
function patientPanel(){
  const s = steps[si];
  return `
  <div class="card step">
    <div class="eyebrow">Step ${si+1} of ${steps.length}</div>
    <div class="dots">${steps.map((_,i)=>`<span class="${i<=si?'on':''}"></span>`).join('')}</div>
    <h2>${s.t}</h2><p>${s.p}</p>${s.extra||''}
  </div>
  <div class="nav">
    <button class="btn" id="prev" ${si===0?'disabled style="opacity:.4"':''}>← Back</button>
    <button class="btn primary" id="next">${si===steps.length-1?'Start again':'Next →'}</button>
  </div>
  <div class="card small muted" style="margin-top:12px">
    This walkthrough is a teaching aid prepared from an AI model's output. Your doctor will explain what your scan actually shows.
  </div>`;
}

let mode = D.mode;
function render(){
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
  $('#panel').innerHTML = mode==='clinician' ? clinicianPanel() : patientPanel();
  if(mode==='clinician'){ wireSpark(); }
  else {
    $('#next').onclick = ()=>{ si = (si+1)%steps.length; render(); steps[si].go(); };
    const pv = $('#prev'); if(pv) pv.onclick = ()=>{ if(si>0){ si--; render(); steps[si].go(); } };
  }
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m; render(); if(mode==='patient'){ si=0; steps[0].go(); } else { setView(4); setCut(false); setHeat(true); jumpHotspot(); }
});
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(+b.dataset.v));
$('#hotBtn').onclick = jumpHotspot;
$('#cutBtn').onclick = ()=>setCut(!cutOn);
$('#heatBtn').onclick = ()=>setHeat(!heatOn);
$('#heatThr').value = D.calMin;
$('#heatThr').oninput = e=>{ const v=nv.volumes[1]; if(!v) return; v.cal_min = +e.target.value; nv.updateGLVolume(); };
$('#heatOp').oninput = e=>{ heatOpacity = +e.target.value; if(heatOn) nv.setOpacity(1, heatOpacity); };

(async ()=>{
  try{
    await nv.attachToCanvas($('#gl'));
    await nv.loadVolumes([
      {url:b64ToUrl(D.volume), name:'brain.nii.gz', colormap:'gray'},
      {url:b64ToUrl(D.heat),   name:'heat.nii.gz',  colormap:'warm', opacity:heatOpacity, cal_min:D.calMin, cal_max:255}
    ]);
    $('#loading').remove();
    render();
    if(mode==='patient') steps[0].go(); else { setView(4); spin(110,15); jumpHotspot(); }
  }catch(err){
    $('#loading').textContent = 'Could not load the volume: ' + err;
    console.error(err);
  }
})();
</script>
</body>
</html>
