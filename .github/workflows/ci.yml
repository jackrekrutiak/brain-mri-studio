name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only PyTorch keeps the install small; the tests need no GPU, datasets or weights.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy nibabel pytest
      - run: pytest -q tests
